name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    # windows-latest is required, not a convenience. SoloSpeaker.App targets
    # net10.0-windows and CsWin32 generates against the Windows SDK.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: >
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: error

      # Publishing on every commit is deliberate. Deployment is a single
      # self-contained exe copied by hand to two machines, so a packaging
      # regression is invisible until release day unless CI exercises it.
      - name: Publish single-file executable
        run: >
          dotnet publish src/SoloSpeaker.App/SoloSpeaker.App.csproj
          -c Release -o artifacts/publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SoloSpeaker-win-x64
          path: |
            artifacts/publish/SoloSpeaker.exe
            scripts/install.ps1
            scripts/uninstall.ps1
          if-no-files-found: error

  script-analysis:
    name: Repository checks
    # The install and uninstall scripts carry the --restore contract of
    # design.md section 7.3. They are the recovery path, so they are linted
    # rather than trusted. The ASCII gate is required by AGENTS.md section 4.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ASCII compliance
        shell: pwsh
        run: ./scripts/Test-Ascii.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # The runner image currently ships PSScriptAnalyzer (see
          # images/windows/toolsets/toolset-2025-vs2026.json in actions/runner-images).
          # Resolving it from PSGallery on every run instead puts an external feed on the
          # critical path of a gate that lints three local files, and on 2026-09-30 that
          # feed reddened main on a C#-only commit. Import the image copy; fall back to
          # PSGallery only when that import fails. PSGallery leaves the steady-state
          # path; it remains the drift path, so the fallback annotates the run.
          $minimumVersion = '1.25.0'
          try {
              $module = Import-Module PSScriptAnalyzer -PassThru -MinimumVersion $minimumVersion -ErrorAction Stop
          }
          catch {
              Write-Host '::warning::PSScriptAnalyzer did not import from the runner image; falling back to PSGallery.'
              Write-Host $_.Exception.Message
              Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion $minimumVersion -ErrorAction Stop
              $module = Import-Module PSScriptAnalyzer -PassThru -MinimumVersion $minimumVersion -ErrorAction Stop
          }
          Write-Host "PSScriptAnalyzer $($module.Version) from $($module.ModuleBase)"
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean.'
